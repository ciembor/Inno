[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=core --cov=config --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["core", "config"]
omit = ["manage.py", "config/asgi.py", "config/wsgi.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.radon]
exclude = ".venv/*,*/migrations/*"
