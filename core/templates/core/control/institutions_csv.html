{% extends "core/control/base.html" %}
{% block control_content %}<h1>Import instytucji z CSV</h1><p>Wymagane kolumny: <code>name,address,institution_type,locality_simc,news_url</code>. Opcjonalnie: <code>additional_news_urls</code>, gdzie adresy oddzielasz znakiem <code>|</code>.</p><form method="post" enctype="multipart/form-data" class="panel-form control-card">{% csrf_token %}<p><label for="file">Plik CSV w UTF-8</label><input id="file" name="file" type="file" accept=".csv,text/csv" required></p><div class="panel-form__actions"><button class="button" type="submit">Importuj plik</button></div></form>{% endblock %}
