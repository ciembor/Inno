{% extends "core/control/base.html" %}
{% block control_content %}<h1>Dane logowania</h1><p>Zmiana hasła jest opcjonalna. Pozostaw oba pola hasła puste, aby zmienić tylko nazwę użytkownika.</p><form method="post" class="panel-form control-card">{% csrf_token %}{% for field in form %}<p><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</p>{% endfor %}<div class="panel-form__actions"><button class="button" type="submit">Zapisz dane</button></div></form>{% endblock %}
