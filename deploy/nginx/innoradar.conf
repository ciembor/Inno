# This file is included inside the existing HTTPS server block.
location = /innoradar {
    return 301 /inno/;
}

location ^~ /innoradar/ {
    rewrite ^/innoradar/(.*)$ /inno/$1 permanent;
}

location = /inno {
    return 301 /inno/;
}

location ^~ /inno/static/ {
    alias /var/www/innoradar/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}

location ^~ /inno/ {
    # The trailing slash deliberately removes /inno before Django receives
    # the request. Django restores that public prefix through FORCE_SCRIPT_NAME.
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /inno;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}
